name: minimo-real
services:
  api:
    build:
      context: .
      dockerfile: services/python/Dockerfile
    env_file: .env
    environment:
      MINIMO_DATA_DIR: /data
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - minimo_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v2/health',timeout=5)"]
      interval: 30s
      timeout: 7s
      retries: 3
volumes:
  minimo_data:
