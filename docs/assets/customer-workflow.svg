<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="235" viewBox="0 0 1120 235" role="img" aria-labelledby="title desc">
<title id="title">MINIMO Studio animated customer journey</title>
<desc id="desc">Four-stage process: upload a photograph, customize the 3D character, approve the design, then complete manual print checks.</desc>
<rect width="1120" height="235" rx="22" fill="#fffbf5" stroke="#eaded3" stroke-width="2"/>
<text x="34" y="39" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#856c61">CUSTOMER EXPERIENCE → MANUFACTURING HANDOFF</text>
<g font-family="Arial,sans-serif">
