<text x="556" y="143" font-size="30" font-weight="900" fill="#ec6b65">›</text>
<g transform="translate(582 65)"><rect width="245" height="139" rx="16" fill="#f9f2e9" stroke="#e3d5ca"/><rect width="245" height="139" rx="16" fill="#ffe1d1" stroke="#eb9a83" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.48;.50;.53;.74;.76" dur="8s" repeatCount="indefinite"/></rect><rect x="16" y="16" width="37" height="37" rx="11" fill="#e76f6b"/><text x="26" y="40" font-weight="700" font-size="12" fill="white">03</text><text x="16" y="92" font-weight="800" font-size="22" fill="#292628">APPROVE</text><text x="16" y="116" font-size="13" fill="#756861">Freeze current version</text></g>
<text x="832" y="143" font-size="30" font-weight="900" fill="#ec6b65">›</text>
